name: Pubblica sito su GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6
      - name: Prepara Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Leggi indirizzo GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Genera e verifica il sito
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          npm run build
          npm run check
      - name: Test automatici
        run: npm test
      - name: Carica il sito generato
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
